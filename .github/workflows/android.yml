name: Build Android package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the installable package
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the package
        run: cp android/app/build/outputs/apk/release/app-release.apk stock-intelligence-india.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stock-intelligence-india
          path: stock-intelligence-india.apk

      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: Installable Android package built automatically from the newest code.
          files: stock-intelligence-india.apk
          make_latest: true
